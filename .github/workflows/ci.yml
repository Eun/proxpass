# this workflow runs CI checks on all pushes and pull requests.
on:
  push:
    branches: [master]
  pull_request:

name: "ci"
jobs:
  # run golangci-lint to lint the golang source code.
  # the configuration is at /.golangci.yml.
  linter:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v7.0.1
      -
        name: Install mise
        uses: jdx/mise-action@v4.2.3
      -
        name: Lint
        run: mise run lint

  # use nancy to scan for vulnerabilities.
  vulnerability_scanner:
    name: Vulnerability scanner
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v7.0.1
      -
        name: Install mise
        uses: jdx/mise-action@v4.2.3
      -
        name: nancy
        run: mise exec -- go list -json -m all | docker run -i sonatypecommunity/nancy:latest

  # run golang test suite and collect coverage.
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v7.0.1
      -
        name: Install mise
        uses: jdx/mise-action@v4.2.3
      -
        name: Test
        run: mise run test
      -
        # The database suite is backend-agnostic: pointing it at Postgres runs
        # the same assertions against the other backend. Without this, a query
        # that only works on SQLite would pass CI and fail in a Postgres
        # deployment.
        #
        # Linux only: the matrix's other platforms have no Docker daemon.
        name: Test against Postgres
        if: matrix.platform == 'ubuntu-latest'
        env:
          PROXPASS_TEST_POSTGRES_DSN: postgres://proxpass:proxpass@127.0.0.1:5432/proxpass?sslmode=disable
        run: |
          docker run -d --name proxpass-test-postgres \
            -e POSTGRES_USER=proxpass \
            -e POSTGRES_PASSWORD=proxpass \
            -e POSTGRES_DB=proxpass \
            -p 5432:5432 postgres:17-alpine
          for _ in $(seq 1 30); do
            docker exec proxpass-test-postgres pg_isready -U proxpass && break
            sleep 1
          done
          go test ./internal/db/... -count=1
      -
        name: Upload coverage
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage.out

  # post code coverage report as a PR comment.
  code_coverage:
    name: "Code coverage report"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents:      read
      actions:        read
      pull-requests: write
    steps:
      - uses: fgrosse/go-coverage-report@v1.4.0
        with:
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.out"

  # ensure the project builds successfully.
  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v7.0.1
      -
        name: Install mise
        uses: jdx/mise-action@v4.2.3
      -
        name: Build
        run: mise run build
