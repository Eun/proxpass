# this workflow runs when a release was published.
on:
  release:
    types: [published]

name: "release_published"
jobs:
  # build and push the multi-arch container image using GoReleaser.
  # proxpass only ships as a container image, so there are no binary, deb or
  # rpm artifacts to attach to the release anymore.
  publish_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        uses: actions/checkout@v7.0.1
      -
        name: Install mise
        uses: jdx/mise-action@v4.2.3
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: GoReleaser
        # builds proxpass for linux/amd64 + linux/arm64, builds the image for
        # both architectures and pushes them plus the multi-arch manifest.
        run: mise exec -- goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ghcr.io
          IMAGE_NAME: eun/proxpass
          IS_LATEST_RELEASE: ${{ !github.event.release.prerelease && github.event.release.make_latest != 'false' }}
