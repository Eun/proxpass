# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: "proxpass"
# proxpass only ships as a container image: the binary is useless on its own
# now that OpenSSH sshd terminates the SSH connection and resolves users
# through libnss_http.so.2. So: linux/amd64 + linux/arm64 only, no archives,
# no deb/rpm, no checksums and no release assets -- just the image.
builds:
  -
    id: "proxpass"
    binary: "proxpass"
    main: "./cmd/proxpass"
    env:
      - "CGO_ENABLED=0"
    goos:
      - "linux"
    goarch:
      - "arm64"
      - "amd64"
    ldflags:
      - -s
      - -w
archives:
  # the image is the only artifact; `binary' means goreleaser does not wrap the
  # binary in a tar.gz it would otherwise have to upload somewhere.
  - formats: ["binary"]
checksum:
  disable: true
snapshot:
  version_template: "{{.Tag}}-next"
changelog:
  disable: true
release:
  # No raw binaries, archives or packages are attached to the GitHub release;
  # the image on ghcr.io is the only artifact.
  disable: true
dockers:
  -
    goos: linux
    goarch: amd64
    ids:
      - "proxpass"
    use: buildx
    image_templates:
      - "{{.Env.REGISTRY}}/{{.Env.IMAGE_NAME}}:{{.Version}}-amd64"
    dockerfile: ".github/Dockerfile"
    # goreleaser builds the image with dist/ as the docker context, so the
    # nsswitch/nss_http/sshd/entrypoint files the Dockerfile COPYs are not
    # visible there unless we stage them in explicitly. Copying the whole
    # docker/ directory keeps the paths inside the Dockerfile identical to the
    # paths in the repo, so `docker build -f .github/Dockerfile .' from the
    # repo root (see `mise run docker') works too.
    extra_files:
      - "docker"
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=BINARY=proxpass"
      - "--platform=linux/amd64"
  -
    goos: linux
    goarch: arm64
    ids:
      - "proxpass"
    use: buildx
    image_templates:
      - "{{.Env.REGISTRY}}/{{.Env.IMAGE_NAME}}:{{.Version}}-arm64"
    dockerfile: ".github/Dockerfile"
    # See the amd64 entry above.
    extra_files:
      - "docker"
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=BINARY=proxpass"
      - "--platform=linux/arm64"
docker_manifests:
  -
    name_template: "{{.Env.REGISTRY}}/{{.Env.IMAGE_NAME}}:latest"
    skip_push: '{{ if ne .Env.IS_LATEST_RELEASE "true" }}true{{ end }}'
    image_templates:
      - "{{.Env.REGISTRY}}/{{.Env.IMAGE_NAME}}:{{.Version}}-amd64"
      - "{{.Env.REGISTRY}}/{{.Env.IMAGE_NAME}}:{{.Version}}-arm64"
  -
    name_template: "{{.Env.REGISTRY}}/{{.Env.IMAGE_NAME}}:{{.Version}}"
    image_templates:
      - "{{.Env.REGISTRY}}/{{.Env.IMAGE_NAME}}:{{.Version}}-amd64"
      - "{{.Env.REGISTRY}}/{{.Env.IMAGE_NAME}}:{{.Version}}-arm64"
