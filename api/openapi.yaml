openapi: 3.0.3

info:
  title: proxpass internal API
  version: 1.0.0
  description: |
    The loopback API that `proxpass serve` exposes.

    This describes the **session API**: what a `proxpass session` uses instead
    of opening the database itself. A session runs as an unprivileged uid and
    must not hold database access, because the database contains Proxmox API
    token secrets and instance SSH private keys -- a session that can read it
    can take over the cluster.

    The same server also serves the NSS directory (`/users`, `/user/name/...`
    and friends) for `libnss_http.so.2`. Those are deliberately NOT described
    here: their JSON shape is fixed by the nss_http wire format, an external
    consumer proxpass does not control, so their types stay hand-written in
    internal/api/types.go where that constraint is documented next to them.
    Generating them would risk silently renaming a field and breaking every
    login, for no benefit.

    Authentication is a bearer token minted by `proxpass authorized-keys`,
    which runs as root before the session exists and therefore knows which key
    authenticated. The session cannot mint or alter one. Tokens are
    short-lived and single-use; scope is derived server-side from the identity
    the token was issued for, never from anything the caller sends.

    That minted token is spent immediately, on `POST /session/exchange`, for
    a session credential that lasts as long as the session. The two differ on
    purpose. The minted one arrives in the session's environment, where any
    process of the same uid can read it -- and every alias session shares one
    uid -- so it is single-use and spent within a second of being issued. The
    credential it buys is held in memory for the life of the process and
    never written to the environment or to disk, so reading it means reading
    another process's memory rather than its `/proc/<pid>/environ`. Only the
    second one can be presented repeatedly, which is what a session needs:
    browsing and connecting are several calls, not one.

    The same server also exposes the **admin REST API** under `/v1`, a set of
    typed resources (instances, clients, groups, guests, access rules,
    instance access rules, default policy, admin keys, settings, discovery)
    that together cover every administrative operation. It REPLACES the older
    `POST /admin/rpc`, whose body was a tagged union -- an operation name plus
    arguments shaped per operation -- that OpenAPI described poorly and
    generated worse. With the database moving out of the admin CLI's reach,
    the CLI becomes an HTTP client of these resources: each `/v1` operation
    maps onto a method of the `db.Repository` interface (see
    internal/db/repository.go) so the two cannot drift. Every `/v1` operation
    requires a bearer token whose stored identity is the administrator's; see
    the `adminToken` security scheme.

servers:
  - url: http://127.0.0.1:8080
    description: |
      Loopback only. The listener is never bound to a routable address, and
      sshd refuses port forwarding, so the only reachable callers are
      processes already inside the container.

tags:
  - name: session
    description: What a guest-console session needs, scoped to its identity.
  - name: admin
    description: |
      The typed admin REST API under `/v1`. Every operation requires the
      `adminToken` bearer scheme and mirrors a `db.Repository` method. These
      replace the old `/admin/rpc` tagged-union endpoint.
  - name: health

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe.
      description: |
        Unauthenticated: the entrypoint polls this before starting sshd, so it
        has to answer before any token exists. It reveals nothing.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /session/exchange:
    post:
      tags: [session]
      summary: Trade the minted token for a session credential.
      description: |
        Consumes the single-use token `proxpass authorized-keys` put in the
        session's environment and returns a credential the session can use
        for the rest of its life, together with the identity it belongs to.

        A session calls this once, at startup, and then forgets the minted
        token. Calling it twice with the same token fails: that token is
        spent.
      operationId: exchangeSessionToken
      responses:
        "200":
          description: The new credential and who it is for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/revoke:
    post:
      tags: [session]
      summary: Give up this session's credential.
      description: |
        Called when a session ends, so the credential stops working at once
        rather than at its expiry. A session that dies without calling this
        leaves a credential that expires on its own.
      operationId: revokeSessionCredential
      responses:
        "204":
          description: The credential is gone, or was never there.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/guests:
    get:
      tags: [session]
      summary: The guests this session may reach.
      description: |
        Already filtered: the server decides from the caller's identity, so
        a guest the caller may not reach is not in the answer at all rather
        than being listed and refused later. The administrator sees every
        guest.

        Carries no credentials. Everything here is what a picker needs to
        draw a list; what it takes to open a console comes from
        `POST /session/connect/{guestId}`, one guest at a time.
      operationId: listSessionGuests
      responses:
        "200":
          description: The reachable guests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/connect/{guestId}:
    post:
      tags: [session]
      summary: What it takes to open this guest's console.
      description: |
        Returns the Proxmox credentials for ONE guest, after checking that
        this caller may reach it. The check is made here, server-side, from
        the stored identity: being able to name a guest is not permission to
        reach it.

        This is the only endpoint that returns secrets, and it returns only
        the instance hosting the named guest. A session therefore holds
        credentials for what it is connecting to, rather than for the whole
        cluster.

        An SSH key configured as a path is read and returned inline. The
        session cannot read that file -- it has no business being able to --
        so returning the path would be useless to it.
      operationId: connectSessionGuest
      parameters:
        - name: guestId
          in: path
          required: true
          description: The guest's row id, as given by `/session/guests`.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The guest and the credentials for its instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The caller may not reach this guest. Deliberately the same answer
            as for a guest that does not exist: telling them apart would turn
            this endpoint into a way to enumerate the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /session/instances:
    get:
      tags: [session]
      summary: The Proxmox nodes this session may reach.
      description: |
        The node equivalent of `/session/guests`, and filtered the same way:
        an instance the caller has no grant for is not in the answer at all.
        The administrator sees every instance.

        A grant on an instance is INDEPENDENT of grants on the guests it
        hosts. Being able to reach a node does not list its guests, and
        being able to reach a guest does not list its node -- what happens
        inside either is not proxpass's concern. So this list is not derived
        from `/session/guests` and generally does not match it.

        The default policy is deliberately not consulted. It predates node
        rules and names no target, so reading it as consent would hand every
        policy-covered client a shell on every node; see
        `HasInstanceAccess`.

        Carries no credentials. What it takes to reach a node comes from
        `POST /session/node/{instanceId}`, one node at a time.
      operationId: listSessionInstances
      responses:
        "200":
          description: The reachable instances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/node/{instanceId}:
    post:
      tags: [session]
      summary: What it takes to open a shell on this node.
      description: |
        The node equivalent of `/session/connect/{guestId}`: the SSH
        credentials for ONE Proxmox node, after checking that this caller
        has been granted it. The check is made here, server-side, from the
        stored identity -- being able to name an instance is not permission
        to reach it, and the list endpoint having filtered is not something
        this endpoint may assume.

        A node is reachable only over SSH, whatever `consoleTransport` says:
        that field decides how a GUEST console is attached and says nothing
        about the node itself. An instance configured for termproxy and
        never given `sshHost` therefore cannot be opened, and asking for it
        is an error rather than a refusal -- it is a configuration problem,
        not a permission one.

        Returns the same shape as a guest connection, so one converter
        serves both. The Proxmox API token travels with it because it
        identifies the instance rather than the node, and the caller has
        already been granted the node it belongs to.
      operationId: connectSessionNode
      parameters:
        - name: instanceId
          in: path
          required: true
          description: The instance's row id, as given by `/session/instances`.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The credentials for reaching the node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The caller may not reach this node. Deliberately the same answer
            as for an instance that does not exist, for the same reason as
            the guest endpoint: telling them apart would turn this into a
            way to enumerate the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /session/login-name-reserved:
    get:
      tags: [session]
      summary: Whether a login name means "browse" rather than "connect".
      description: |
        Only the administrator's name is reserved, so `ssh admin@host` opens
        the picker rather than looking for a guest called "admin". Every
        other name -- including a client's own -- resolves to the guest that
        bears it.

        Retained for compatibility: the session now answers this for itself
        and no longer calls the endpoint. A client name used to be reserved
        too, which made `ssh web@host` open a picker for everyone the moment
        a client was called "web".
      operationId: isLoginNameReserved
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                type: object
                required: [reserved]
                properties:
                  reserved:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/public-endpoint:
    get:
      tags: [session]
      summary: The hostname clients use to reach this proxpass.
      description: |
        Shown in the console status bar. `proxpass serve` recorded it because
        sshd gives a session a fresh environment, so the session cannot read
        PROXPASS_PUBLIC_ENDPOINT itself.

        Empty when the deployment has not been told what its endpoint is;
        that is not an error, and the bar simply shows a shorter label.
      operationId: getPublicEndpoint
      responses:
        "200":
          description: The endpoint, possibly empty.
          content:
            application/json:
              schema:
                type: object
                required: [endpoint]
                properties:
                  endpoint:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/identity:
    get:
      tags: [session]
      summary: Who the calling token belongs to.
      description: |
        The answer comes from the token, not from anything the caller sends.
        A session asks this instead of deciding for itself: it has no
        trustworthy way to know which key authenticated it.

        Takes a session credential, not the minted token: that one is spent
        by `POST /session/exchange`, which already returns the identity. This
        is here for a caller that holds a credential and wants to re-read who
        it is without having kept the answer.
      operationId: getSessionIdentity
      responses:
        "200":
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Admin REST API (/v1)
  #
  # Typed resources that replace the old /admin/rpc tagged union. Every
  # operation below requires the adminToken bearer scheme (admin scope) and
  # maps onto a db.Repository method. The session routes above and the NSS
  # directory routes keep their own authentication and are unaffected.
  # ---------------------------------------------------------------------------

  /v1/instances:
    get:
      tags: [admin]
      summary: List Proxmox instances.
      description: Mirrors `db.Repository.ListProxmoxInstances`.
      operationId: listInstances
      security:
        - adminToken: []
      responses:
        "200":
          description: Every configured Proxmox instance.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProxmoxInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      summary: Add a Proxmox instance.
      description: |
        Mirrors `db.Repository.AddProxmoxInstance`. The id is assigned by the
        server and ignored on input.
      operationId: addInstance
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxmoxInstance"
      responses:
        "201":
          description: The instance as stored, with its assigned id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxmoxInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/instances/{id}:
    parameters:
      - $ref: "#/components/parameters/RowId"
    get:
      tags: [admin]
      summary: Get one Proxmox instance.
      description: |
        There is no dedicated repository getter for a single instance; the
        server resolves it from `ListProxmoxInstances`.
      operationId: getInstance
      security:
        - adminToken: []
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxmoxInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [admin]
      summary: Update a Proxmox instance.
      description: |
        Mirrors `db.Repository.UpdateProxmoxInstance`. The id in the path wins;
        any id in the body is ignored.
      operationId: updateInstance
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxmoxInstance"
      responses:
        "200":
          description: The updated instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxmoxInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [admin]
      summary: Remove a Proxmox instance.
      description: Mirrors `db.Repository.RemoveProxmoxInstance`.
      operationId: removeInstance
      security:
        - adminToken: []
      responses:
        "204":
          description: The instance is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/clients:
    get:
      tags: [admin]
      summary: List clients, or look one up by name.
      description: |
        With no query this mirrors `db.Repository.ListClients`. With `name`
        it mirrors `db.Repository.GetClientByName` and returns the single
        matching client (404 when none matches). The by-name lookup is modeled
        as a query parameter rather than a sub-path so a caller holding only a
        name needs no separate route.
      operationId: listClients
      security:
        - adminToken: []
      parameters:
        - name: name
          in: query
          required: false
          description: |
            When set, return only the client with this exact name (as
            `GetClientByName`) rather than the whole list.
          schema:
            type: string
      responses:
        "200":
          description: |
            The clients. An array when listing; a single-element array when a
            `name` matched.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminClient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      summary: Add a client.
      description: Mirrors `db.Repository.AddClient`. The id is server-assigned.
      operationId: addClient
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClient"
      responses:
        "201":
          description: The client as stored, with its assigned id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/RowId"
    get:
      tags: [admin]
      summary: Get one client.
      operationId: getClient
      security:
        - adminToken: []
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [admin]
      summary: Update a client.
      description: Mirrors `db.Repository.UpdateClient`. The path id wins.
      operationId: updateClient
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClient"
      responses:
        "200":
          description: The updated client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [admin]
      summary: Remove a client.
      description: Mirrors `db.Repository.RemoveClient`.
      operationId: removeClient
      security:
        - adminToken: []
      responses:
        "204":
          description: The client is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/groups:
    get:
      tags: [admin]
      summary: List groups.
      description: Mirrors `db.Repository.ListGroups`.
      operationId: listGroups
      security:
        - adminToken: []
      responses:
        "200":
          description: Every group.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      summary: Add a group.
      description: Mirrors `db.Repository.AddGroup`. The id is server-assigned.
      operationId: addGroup
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientGroup"
      responses:
        "201":
          description: The group as stored, with its assigned id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/groups/{id}:
    parameters:
      - $ref: "#/components/parameters/RowId"
    get:
      tags: [admin]
      summary: Get one group.
      operationId: getGroup
      security:
        - adminToken: []
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [admin]
      summary: Update a group.
      description: Mirrors `db.Repository.UpdateGroup`. The path id wins.
      operationId: updateGroup
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientGroup"
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [admin]
      summary: Remove a group.
      description: Mirrors `db.Repository.RemoveGroup`.
      operationId: removeGroup
      security:
        - adminToken: []
      responses:
        "204":
          description: The group is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/guests:
    get:
      tags: [admin]
      summary: List guests.
      description: |
        Mirrors `db.Repository.ListGuests`. Guests are DISCOVERED from the
        Proxmox instances, not created through the API, so there is no POST;
        use `POST /v1/discover` to refresh them.
      operationId: listGuests
      security:
        - adminToken: []
      responses:
        "200":
          description: Every discovered guest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/guests/{id}:
    parameters:
      - $ref: "#/components/parameters/RowId"
    get:
      tags: [admin]
      summary: Get one guest.
      description: Mirrors `db.Repository.GetGuestByID`.
      operationId: getGuest
      security:
        - adminToken: []
      responses:
        "200":
          description: The guest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/access-rules:
    get:
      tags: [admin]
      summary: List guest access rules.
      description: |
        Mirrors `db.Repository.ListAccessRules`: one row per (subject, guest)
        grant, where the subject is a client or a group.
      operationId: listAccessRules
      security:
        - adminToken: []
      responses:
        "200":
          description: Every guest access rule.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessRuleRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/access-rules/grant:
    post:
      tags: [admin]
      summary: Grant a client or group access to guests.
      description: |
        Mirrors `GrantClientAccess` / `GrantGroupAccess`. The subject's `kind`
        selects which: `client` grants to one client, `group` to one group.
        The `guest_ids` are added to that subject in one call.
      operationId: grantAccess
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccessChange"
      responses:
        "204":
          description: The grant was applied.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/access-rules/revoke:
    post:
      tags: [admin]
      summary: Revoke a client's or group's access to guests.
      description: |
        Mirrors `RevokeClientAccess` / `RevokeGroupAccess`. The repository
        revokes one (subject, guest) pair at a time; this accepts a list of
        `guest_ids` and revokes each from the named subject.
      operationId: revokeAccess
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccessChange"
      responses:
        "204":
          description: The revocation was applied.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/instance-access-rules:
    get:
      tags: [admin]
      summary: List instance (node) access rules.
      description: |
        Mirrors `db.Repository.ListInstanceAccessRules`: one row per
        (subject, instance) grant. Separate from guest access rules because a
        node grant and a guest grant confer different things.
      operationId: listInstanceAccessRules
      security:
        - adminToken: []
      responses:
        "200":
          description: Every instance access rule.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstanceAccessRuleRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/instance-access-rules/grant:
    post:
      tags: [admin]
      summary: Grant a client or group access to instances.
      description: |
        Mirrors `GrantClientInstanceAccess` / `GrantGroupInstanceAccess`. The
        subject's `kind` selects which. The `instance_ids` are granted to that
        subject in one call.
      operationId: grantInstanceAccess
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceAccessChange"
      responses:
        "204":
          description: The grant was applied.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/instance-access-rules/revoke:
    post:
      tags: [admin]
      summary: Revoke a client's or group's access to instances.
      description: |
        Mirrors `RevokeClientInstanceAccess` / `RevokeGroupInstanceAccess`.
        Accepts a list of `instance_ids` and revokes each from the named
        subject.
      operationId: revokeInstanceAccess
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceAccessChange"
      responses:
        "204":
          description: The revocation was applied.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/policy:
    get:
      tags: [admin]
      summary: Get the default access policy.
      description: Mirrors `db.Repository.GetDefaultPolicy`.
      operationId: getDefaultPolicy
      security:
        - adminToken: []
      responses:
        "200":
          description: The current default access policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultAccessPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [admin]
      summary: Set the default access policy.
      description: Mirrors `db.Repository.SetDefaultPolicy`.
      operationId: setDefaultPolicy
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefaultAccessPolicy"
      responses:
        "200":
          description: The stored default access policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultAccessPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin-keys:
    get:
      tags: [admin]
      summary: List admin public keys.
      description: Mirrors `db.Repository.ListAdminKeys`.
      operationId: listAdminKeys
      security:
        - adminToken: []
      responses:
        "200":
          description: Every authorized admin public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      summary: Add an admin public key.
      description: Mirrors `db.Repository.AddAdminKey`.
      operationId: addAdminKey
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKey"
      responses:
        "204":
          description: The key is authorized.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [admin]
      summary: Remove an admin public key.
      description: |
        Mirrors `db.Repository.RemoveAdminKey`. The key to remove is carried in
        the request body, because a public key is long and does not belong in a
        URL or log line.
      operationId: removeAdminKey
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKey"
      responses:
        "204":
          description: The key is no longer authorized.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/settings:
    get:
      tags: [admin]
      summary: List the effective settings.
      description: |
        Returns every operator-facing setting that governs this running serve
        process -- the configuration it was started with (flags/environment)
        plus the stored public endpoint -- each with its source. Secret values
        (tokens, the database password) are masked by the server and never
        returned in cleartext. These are read-only: they come from the
        environment/flags, so changing them means changing the configuration
        and restarting, not writing through this API.
      operationId: listSettings
      security:
        - adminToken: []
      responses:
        "200":
          description: The effective settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SettingEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: The setting key, e.g. `public_endpoint`.
        schema:
          type: string
    get:
      tags: [admin]
      summary: Get a setting value.
      description: Mirrors `db.Repository.GetSetting`.
      operationId: getSetting
      security:
        - adminToken: []
      responses:
        "200":
          description: The setting's value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [admin]
      summary: Set a setting value.
      description: |
        Mirrors `db.Repository.SetSetting`. The key in the path names the
        setting; the body carries its new value.
      operationId: setSetting
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingValue"
      responses:
        "200":
          description: The stored setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/discover:
    post:
      tags: [admin]
      summary: Run guest discovery now.
      description: |
        Triggers a discovery pass, the same one `proxpass discover` runs: each
        instance is polled, running guests are stored and stale ones pruned.
        With no `instance` query every configured instance is discovered; with
        `instance` set, only that one. Returns a per-instance summary.
      operationId: runDiscovery
      security:
        - adminToken: []
      parameters:
        - name: instance
          in: query
          required: false
          description: |
            When set, discover only the instance with this row id rather than
            all of them.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The discovery summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/version:
    get:
      tags: [admin]
      summary: The proxpass build version.
      description: |
        Returns the running proxpass build version -- the release tag for a
        release build, otherwise the module version or "dev". The admin UI
        fetches this once on load to show it in the sidebar.
      operationId: getVersion
      security:
        - adminToken: []
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/latest-version:
    get:
      tags: [admin]
      summary: The latest proxpass release on GitHub.
      description: |
        Reports whether a newer proxpass release is available, by comparing the
        running build version against the latest GitHub release. The result is
        cached server-side for a few hours, so the admin UI can poll it to show
        an "update available" hint without each client calling GitHub.

        update_available is false when the deployment is up to date, when the
        running build has no comparable version (a "dev" build), when the
        update check is disabled (PROXPASS_UPDATE_CHECK), or when GitHub could
        not be reached -- in every such case latest may be empty and the hint
        is simply not shown.
      operationId: getLatestVersion
      security:
        - adminToken: []
      responses:
        "200":
          description: The latest-version comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/proxpass-ssh-public-key:
    get:
      tags: [admin]
      summary: proxpass's SSH public key.
      description: |
        Returns the public half of the deployment's SSH key -- the
        authorized_keys line the administrator installs on each Proxmox host
        so proxpass can log in over SSH. The private key never leaves the
        server, and the key file's location on the server is not exposed.

        key is empty when the deployment has no SSH key yet (a termproxy-only
        setup that never logs in over SSH). The admin UI calls this after a
        node is added so the "finish SSH setup" dialog can show the exact key
        to install, without the operator needing an admin SSH session.
      operationId: getProxpassSSHPublicKey
      security:
        - adminToken: []
      responses:
        "200":
          description: The public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHPublicKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/ssh-fingerprints:
    post:
      tags: [admin]
      summary: Scan a host's SSH fingerprints.
      description: |
        Connects to the given SSH host and port and returns the host-key
        fingerprints it presents, one per key type -- the server-side
        equivalent of `ssh-keyscan`. No authentication is attempted; the
        handshake is aborted as soon as the host key is read.

        This lets the admin UI fetch the real fingerprints when adding a node,
        so the operator can pick one to pin instead of running ssh-keyscan by
        hand. A scan only reports what the host currently presents -- the
        operator must still confirm the chosen fingerprint out of band.
      operationId: scanSSHFingerprints
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHFingerprintScan"
      responses:
        "200":
          description: The host keys the server presented.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SSHFingerprint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: |
            The host could not be scanned (unreachable, timed out, or presented
            no host key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        A token minted by `proxpass authorized-keys` for the key that
        authenticated, and handed to the session out of band. Short-lived and
        single-use.

        Deliberately NOT derived from anything the session controls: the
        session's own `$SSH_USER_AUTH` file is owned and writable by the
        session user, so a claim based on it could be forged.

    adminToken:
      type: http
      scheme: bearer
      description: |
        A bearer credential whose stored identity is the administrator's. It
        is required by every `/v1` admin operation and is the admin-scoped
        counterpart of `sessionToken`: the session routes and the NSS
        directory routes keep their own authentication and are unaffected by
        this scheme.

  parameters:
    RowId:
      name: id
      in: path
      required: true
      description: The resource's row id.
      schema:
        type: integer
        format: int64

  responses:
    Unauthorized:
      description: The token is missing, expired, already used, or unknown.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The caller is authenticated but not the administrator; `/v1` is
        admin-only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request body or parameters were malformed or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The request conflicts with existing state -- for example a name that
        is already taken.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The server failed to complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Guest:
      type: object
      description: |
        A guest as a picker needs it. Deliberately carries nothing that could
        be used to reach the guest: a session holds this list for its whole
        life, and most of it is never connected to.
      required: [id, name, type, status, proxmoxId, instanceId, instanceName]
      properties:
        id:
          type: integer
          format: int64
          description: The row id, used to ask for a connection.
        name:
          type: string
        type:
          type: string
          enum: [ct, vm]
        status:
          type: string
          enum: [running, stopped]
        proxmoxId:
          type: integer
          description: The guest's id within its Proxmox instance, e.g. 100.
        instanceId:
          type: integer
          format: int64
        instanceName:
          type: string
          description: |
            Included so a caller can show and match on it without a second
            request. It is the only thing about an instance that BROWSING
            GUESTS needs, so a guest list never costs a second call.

            `/session/instances` is a different question -- which nodes may
            be reached in their own right -- and its answer is not derived
            from this one.

    Instance:
      type: object
      description: |
        A Proxmox node as a picker needs it. The node counterpart of
        `Guest`, and like it deliberately carries nothing that could be used
        to reach the node: a session holds this list for its whole life, and
        most of it is never connected to.
      required: [id, name, node]
      properties:
        id:
          type: integer
          format: int64
          description: The row id, used to ask for a connection.
        name:
          type: string
          description: |
            What the administrator called this instance, and the name a
            client reaches it by as `<name>@proxpass`. Stored lower case.
        node:
          type: string
          description: |
            The resolved Proxmox short node name, which is what the cluster
            calls the machine. Usually equal to `name`, but not necessarily:
            `name` is proxpass's label and an administrator may choose it
            freely.

    ConnectInfo:
      type: object
      description: |
        Everything needed to open one guest's console, and nothing about any
        other guest or instance.
      required: [guest, instance]
      properties:
        guest:
          $ref: "#/components/schemas/Guest"
        instance:
          $ref: "#/components/schemas/InstanceCredentials"

    InstanceCredentials:
      type: object
      description: |
        The Proxmox credentials for the instance hosting one guest.

        This is the material a session must not be able to read from the
        database, handed over for a single connection it has been authorized
        to make.
      required: [id, name, apiUrl, consoleTransport, node]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        apiUrl:
          type: string
        apiTokenId:
          type: string
        apiTokenSecret:
          type: string
          description: Present when the instance connects over the API.
        consoleTransport:
          type: string
          enum: [termproxy, ssh]
          description: |
            How a guest CONSOLE is attached: through the Proxmox websocket, or
            by running pct enter over SSH on the node.

            It says nothing about whether the node is reachable, and nothing
            about file transfer. The SSH fields below are populated either
            way.
        node:
          type: string
          description: The resolved Proxmox short node name.
        insecureTls:
          type: boolean
          description: |
            When true, TLS certificate verification is skipped for the API and
            termproxy console. Off by default: connections are verified.
        insecureSsh:
          type: boolean
          description: |
            When true, SSH host-key verification is skipped for node
            connections. Off by default: the host key is verified against a
            pinned fingerprint or DNSSEC-validated SSHFP records.
        sshHost:
          type: string
          description: |
            How to reach the Proxmox node over SSH, whatever the console
            transport. File transfer runs commands on the node, so it needs
            these even when consoles go through the websocket.
        sshPort:
          type: integer
        sshUser:
          type: string
        sshFingerprints:
          type: array
          items:
            type: string
          description: |
            The pinned SSH host-key fingerprints ("SHA256:<base64>" each); the
            node's host key must match any one of them. When absent/empty, the
            host key is verified against DNSSEC-validated SSHFP records instead.
        sshKey:
          type: string
          description: |
            PEM-encoded private key, inline.

            One key serves every instance: proxpass generates it on its
            volume and the administrator installs its public half on each
            Proxmox host. It is read here and sent inline because a session
            cannot read the file -- it is root-owned, and the session is not
            root. The key is therefore handed over per connection, only
            after the access check has passed.

    SessionCredential:
      type: object
      description: |
        A session credential and the identity it speaks for.
      required: [token, expiresAt, identity]
      properties:
        token:
          type: string
          description: |
            Present this as the bearer token on later calls. Hold it in
            memory only: putting it in the environment would undo the reason
            it exists.
        expiresAt:
          type: string
          format: date-time
          description: |
            When it stops working regardless of use. A session outliving this
            has to exchange again, which it cannot do -- so the window is
            generous enough to cover a long console attach.
        identity:
          $ref: "#/components/schemas/Identity"

    Identity:
      type: object
      description: Who a session is, as resolved from its token.
      required: [loginName, identityName, isAdmin]
      properties:
        loginName:
          type: string
          description: |
            What the caller typed in `ssh <name>@host`. A REQUEST PARAMETER,
            not an identity: any name the directory does not already serve
            resolves to an alias, so anybody can pick anybody else's. The
            session also accepts it as a guest target ("ssh ct100@host").
            Never log it as the actor and never authorize from it.
        identityName:
          type: string
          description: |
            Who the caller IS: the client's own name, or the administrator's.
            Resolved by `proxpass authorized-keys`, which runs as root before
            the session exists and therefore knows which key authenticated,
            so the session cannot influence it. This is the name to log and
            the name to show.
        isAdmin:
          type: boolean
        clientId:
          type: integer
          format: int64
          description: The client's row id. Absent for the administrator.

    # -------------------------------------------------------------------------
    # Admin REST API (/v1) schemas.
    #
    # Property names here match the json tags of the Go models in
    # internal/models/models.go exactly (snake_case), so the admin CLI's HTTP
    # client and the stored rows cannot drift.
    # -------------------------------------------------------------------------

    ProxmoxInstance:
      type: object
      description: |
        A Proxmox instance as the admin API carries it, mirroring
        models.ProxmoxInstance. This is the full administrative view and,
        unlike the session-scoped `InstanceCredentials`, includes the stored
        API token secret.
      required:
        - id
        - name
        - api_url
        - api_token_id
        - api_token_secret
        - console_transport
        - node
        - insecure_tls
        - insecure_ssh
        - ssh_host
        - ssh_port
        - ssh_user
        - ssh_fingerprints
      properties:
        id:
          type: integer
          format: int64
          description: The row id. Server-assigned; ignored on create.
        name:
          type: string
          description: |
            What the administrator called this instance. Stored lower case.
        api_url:
          type: string
        api_token_id:
          type: string
        api_token_secret:
          type: string
        console_transport:
          type: string
          enum: [termproxy, ssh]
          description: How a guest CONSOLE is attached; see models.ConsoleTransport.
        node:
          type: string
          description: The resolved Proxmox short node name.
        insecure_tls:
          type: boolean
          description: |
            When true, TLS certificate verification is skipped for the API and
            termproxy console. Off by default.
        insecure_ssh:
          type: boolean
          description: |
            When true, SSH host-key verification is skipped for node
            connections. Off by default.
        ssh_host:
          type: string
        ssh_port:
          type: integer
        ssh_user:
          type: string
        ssh_fingerprints:
          type: array
          items:
            type: string
          description: |
            The pinned SSH host-key fingerprints ("SHA256:<base64>" each). The
            host key the node presents must match ANY one of them -- several
            may be pinned because a node answers with a different host key per
            algorithm and may be re-keyed. When empty, the host key is verified
            against DNSSEC-validated SSHFP records instead.

    AdminClient:
      type: object
      description: A client, mirroring models.Client.
      required: [id, name, public_keys, group_ids]
      properties:
        id:
          type: integer
          format: int64
          description: The row id. Server-assigned; ignored on create.
        name:
          type: string
        public_keys:
          type: array
          items:
            type: string
        group_ids:
          type: array
          items:
            type: integer
            format: int64

    ClientGroup:
      type: object
      description: |
        A group, mirroring models.Group. Named `ClientGroup` in the spec to
        avoid colliding with the hand-written NSS `Group` type in
        internal/api/types.go, whose JSON shape is fixed by the nss_http wire
        format and must not be regenerated.
      required: [id, name, client_ids]
      properties:
        id:
          type: integer
          format: int64
          description: The row id. Server-assigned; ignored on create.
        name:
          type: string
        client_ids:
          type: array
          items:
            type: integer
            format: int64

    GuestRow:
      type: object
      description: |
        A guest as the admin API carries it, mirroring models.Guest. Named
        `GuestRow` to avoid colliding with the session-scoped `Guest` schema,
        which carries a different, picker-oriented shape.
      required: [id, type, name, status, proxmox_id, instance_id]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [ct, vm]
        name:
          type: string
        status:
          type: string
          enum: [running, stopped]
        proxmox_id:
          type: integer
          description: The guest's id within its Proxmox instance, e.g. 100.
        instance_id:
          type: integer
          format: int64

    AccessRuleRow:
      type: object
      description: |
        One guest access rule, mirroring models.AccessRuleRow: a flat per-row
        representation with one guest per row.
      required: [id, type, subject_id, guest_id]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/RuleType"
        subject_id:
          type: integer
          format: int64
          description: The client or group id, per `type`.
        guest_id:
          type: integer
          format: int64

    InstanceAccessRuleRow:
      type: object
      description: |
        One instance (node) access rule, mirroring
        models.InstanceAccessRuleRow: one instance per row.
      required: [id, type, subject_id, instance_id]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/RuleType"
        subject_id:
          type: integer
          format: int64
          description: The client or group id, per `type`.
        instance_id:
          type: integer
          format: int64

    RuleType:
      type: string
      enum: [client, group]
      x-enum-varnames: [RuleTypeClient, RuleTypeGroup]
      description: |
        Whether an access rule's subject is a client or a group; mirrors
        models.RuleType.

    DefaultAccessPolicy:
      type: object
      description: |
        The default access policy, mirroring models.DefaultAccessPolicy: the
        clients and groups granted access to guests not covered by an explicit
        rule.
      required: [authorized_client_ids, authorized_group_ids]
      properties:
        authorized_client_ids:
          type: array
          items:
            type: integer
            format: int64
        authorized_group_ids:
          type: array
          items:
            type: integer
            format: int64

    AccessSubject:
      type: object
      description: |
        Who a grant or revoke applies to: a client or a group, selected by
        `kind`. Mirrors the client/group split of the Grant*/Revoke* methods.
      required: [kind, id]
      properties:
        kind:
          $ref: "#/components/schemas/RuleType"
        id:
          type: integer
          format: int64
          description: The client or group row id, per `kind`.

    GuestAccessChange:
      type: object
      description: |
        A guest grant or revoke for one subject. On grant, every id in
        `guest_ids` is added to the subject (GrantClientAccess /
        GrantGroupAccess); on revoke, every id is removed (RevokeClientAccess /
        RevokeGroupAccess, which the server applies one pair at a time).
      required: [subject, guest_ids]
      properties:
        subject:
          $ref: "#/components/schemas/AccessSubject"
        guest_ids:
          type: array
          items:
            type: integer
            format: int64

    InstanceAccessChange:
      type: object
      description: |
        An instance (node) grant or revoke for one subject, the node
        counterpart of `GuestAccessChange`. Mirrors
        GrantClient/GroupInstanceAccess and RevokeClient/GroupInstanceAccess.
      required: [subject, instance_ids]
      properties:
        subject:
          $ref: "#/components/schemas/AccessSubject"
        instance_ids:
          type: array
          items:
            type: integer
            format: int64

    AdminKey:
      type: object
      description: |
        A single admin public key, used to add (AddAdminKey) or remove
        (RemoveAdminKey) one. The key travels in the body rather than the URL
        because it is long and should not appear in logs.
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The authorized SSH public key, in authorized_keys form.

    AdminKeyList:
      type: object
      description: |
        The authorized admin public keys, mirroring ListAdminKeys (a list of
        strings), wrapped in an object so the response is self-describing.
      required: [public_keys]
      properties:
        public_keys:
          type: array
          items:
            type: string

    SettingValue:
      type: object
      description: The new value for a setting; mirrors SetSetting's value argument.
      required: [value]
      properties:
        value:
          type: string

    Setting:
      type: object
      description: |
        A setting's key and value, as returned by GetSetting (the key echoes
        the path parameter).
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string

    SettingEntry:
      type: object
      description: |
        One effective setting in the listSettings view: the environment
        variable that controls it (key) and its current value. Secret-bearing
        values (tokens, the database password) are masked by the server and
        never returned in cleartext.
      required: [key, value]
      properties:
        key:
          type: string
          description: The environment variable, e.g. PROXPASS_DATA.
        value:
          type: string

    DiscoverResult:
      type: object
      description: |
        The outcome of a discovery pass, mirroring what `proxpass discover`
        prints: one entry per instance plus a total of stored guests.
      required: [instances, total]
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/DiscoverInstanceResult"
        total:
          type: integer
          description: The total number of guests stored across all instances.

    DiscoverInstanceResult:
      type: object
      description: The discovery outcome for one instance.
      required: [instance_id, name, discovered, stored, removed]
      properties:
        instance_id:
          type: integer
          format: int64
        name:
          type: string
        discovered:
          type: integer
          description: How many guests the instance reported.
        stored:
          type: integer
          description: How many running guests were stored.
        removed:
          type: integer
          description: How many stale guests were pruned.
        error:
          type: string
          description: |
            Set when this instance failed; the pass continues with the others,
            so a failure here does not fail the whole call.

    Version:
      type: object
      description: The running proxpass build version.
      required: [version]
      properties:
        version:
          type: string
          description: The release tag, module version, or "dev".

    LatestVersion:
      type: object
      description: |
        A comparison of the running build against the latest GitHub release.
      required: [current, latest, update_available, html_url]
      properties:
        current:
          type: string
          description: The running build version (the release tag, or "dev").
        latest:
          type: string
          description: |
            The latest release tag on GitHub, or "" when the check is disabled
            or GitHub could not be reached.
        update_available:
          type: boolean
          description: |
            True when latest is a newer release than current. Always false for
            a "dev" build, a disabled check, or an unreachable GitHub.
        html_url:
          type: string
          description: |
            The GitHub release page for latest, or "" when there is nothing to
            link to.

    SSHPublicKey:
      type: object
      description: |
        The public half of proxpass's deployment SSH key. The private key is
        never returned, and the key file's path on the server is not exposed.
      required: [key]
      properties:
        key:
          type: string
          description: |
            The authorized_keys line to install on each Proxmox host, or ""
            when the deployment has no SSH key yet.

    SSHFingerprintScan:
      type: object
      description: The host to scan for SSH host-key fingerprints.
      required: [ssh_host, ssh_port]
      properties:
        ssh_host:
          type: string
          description: The SSH host to connect to.
        ssh_port:
          type: integer
          description: The SSH port, typically 22.

    SSHFingerprint:
      type: object
      description: One host key a scanned server presented.
      required: [key_type, fingerprint]
      properties:
        key_type:
          type: string
          description: The key's algorithm, e.g. "ssh-ed25519".
        fingerprint:
          type: string
          description: |
            The "SHA256:<base64>" fingerprint, exactly what --ssh-fingerprint
            pins and what the UI stores in ssh_fingerprint.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            A short reason. Deliberately not detailed: these responses are
            reachable before a caller is authenticated.

security:
  - sessionToken: []
