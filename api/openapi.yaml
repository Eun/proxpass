openapi: 3.0.3

info:
  title: proxpass internal API
  version: 1.0.0
  description: |
    The loopback API that `proxpass serve` exposes.

    This describes the **session API**: what a `proxpass session` uses instead
    of opening the database itself. A session runs as an unprivileged uid and
    must not hold database access, because the database contains Proxmox API
    token secrets and instance SSH private keys -- a session that can read it
    can take over the cluster.

    The same server also serves the NSS directory (`/users`, `/user/name/...`
    and friends) for `libnss_http.so.2`. Those are deliberately NOT described
    here: their JSON shape is fixed by the nss_http wire format, an external
    consumer proxpass does not control, so their types stay hand-written in
    internal/api/types.go where that constraint is documented next to them.
    Generating them would risk silently renaming a field and breaking every
    login, for no benefit.

    Authentication is a bearer token minted by `proxpass authorized-keys`,
    which runs as root before the session exists and therefore knows which key
    authenticated. The session cannot mint or alter one. Tokens are
    short-lived and single-use; scope is derived server-side from the identity
    the token was issued for, never from anything the caller sends.

    That minted token is spent immediately, on `POST /session/exchange`, for
    a session credential that lasts as long as the session. The two differ on
    purpose. The minted one arrives in the session's environment, where any
    process of the same uid can read it -- and every alias session shares one
    uid -- so it is single-use and spent within a second of being issued. The
    credential it buys is held in memory for the life of the process and
    never written to the environment or to disk, so reading it means reading
    another process's memory rather than its `/proc/<pid>/environ`. Only the
    second one can be presented repeatedly, which is what a session needs:
    browsing and connecting are several calls, not one.

servers:
  - url: http://127.0.0.1:8080
    description: |
      Loopback only. The listener is never bound to a routable address, and
      sshd refuses port forwarding, so the only reachable callers are
      processes already inside the container.

tags:
  - name: session
    description: What a guest-console session needs, scoped to its identity.
  - name: health

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe.
      description: |
        Unauthenticated: the entrypoint polls this before starting sshd, so it
        has to answer before any token exists. It reveals nothing.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /session/exchange:
    post:
      tags: [session]
      summary: Trade the minted token for a session credential.
      description: |
        Consumes the single-use token `proxpass authorized-keys` put in the
        session's environment and returns a credential the session can use
        for the rest of its life, together with the identity it belongs to.

        A session calls this once, at startup, and then forgets the minted
        token. Calling it twice with the same token fails: that token is
        spent.
      operationId: exchangeSessionToken
      responses:
        "200":
          description: The new credential and who it is for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/revoke:
    post:
      tags: [session]
      summary: Give up this session's credential.
      description: |
        Called when a session ends, so the credential stops working at once
        rather than at its expiry. A session that dies without calling this
        leaves a credential that expires on its own.
      operationId: revokeSessionCredential
      responses:
        "204":
          description: The credential is gone, or was never there.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /session/identity:
    get:
      tags: [session]
      summary: Who the calling token belongs to.
      description: |
        The answer comes from the token, not from anything the caller sends.
        A session asks this instead of deciding for itself: it has no
        trustworthy way to know which key authenticated it.

        Takes a session credential, not the minted token: that one is spent
        by `POST /session/exchange`, which already returns the identity. This
        is here for a caller that holds a credential and wants to re-read who
        it is without having kept the answer.
      operationId: getSessionIdentity
      responses:
        "200":
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        A token minted by `proxpass authorized-keys` for the key that
        authenticated, and handed to the session out of band. Short-lived and
        single-use.

        Deliberately NOT derived from anything the session controls: the
        session's own `$SSH_USER_AUTH` file is owned and writable by the
        session user, so a claim based on it could be forged.

  responses:
    Unauthorized:
      description: The token is missing, expired, already used, or unknown.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    SessionCredential:
      type: object
      description: |
        A session credential and the identity it speaks for.
      required: [token, expiresAt, identity]
      properties:
        token:
          type: string
          description: |
            Present this as the bearer token on later calls. Hold it in
            memory only: putting it in the environment would undo the reason
            it exists.
        expiresAt:
          type: string
          format: date-time
          description: |
            When it stops working regardless of use. A session outliving this
            has to exchange again, which it cannot do -- so the window is
            generous enough to cover a long console attach.
        identity:
          $ref: "#/components/schemas/Identity"

    Identity:
      type: object
      description: Who a session is, as resolved from its token.
      required: [user, displayName, isAdmin]
      properties:
        user:
          type: string
          description: The login name the session arrived with, kept for the audit log.
        displayName:
          type: string
          description: |
            The configured identity to show the user: the admin user name, or
            the client's own name. The login name is an alias the caller
            chose, so it is not what the UI should display.
        isAdmin:
          type: boolean
        clientId:
          type: integer
          format: int64
          description: The client's row id. Absent for the administrator.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            A short reason. Deliberately not detailed: these responses are
            reachable before a caller is authenticated.

security:
  - sessionToken: []
