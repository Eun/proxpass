# /etc/nsswitch.conf for the proxpass image.
#
# proxpass users are not real unix accounts: they are resolved over NSS by
# /lib/libnss_http.so.2 (github.com/Eun/nss_http-go), which queries the HTTP API
# that `proxpass serve` exposes on 127.0.0.1:8080.
#
# `http' is listed AFTER `files' on purpose, so that the real accounts shipped
# by the base image (root, sshd, nobody, ...) always win and can never be
# shadowed by whatever the API returns.

passwd:         files http
group:          files http
shadow:         files http
gshadow:        files http

# Everything below is plain glibc defaults, minus the `db' and `nis' sources:
# this image installs neither libnss-db nor libnss-nis, and naming a missing
# NSS module makes every lookup for that database log a dlopen failure.
hosts:          files dns
networks:       files

protocols:      files
services:       files
ethers:         files
rpc:            files
