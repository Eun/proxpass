# proxpass sshd drop-in.
#
# Included from /etc/ssh/sshd_config via its `Include /etc/ssh/sshd_config.d/*.conf'
# line, which Debian ships since bookworm. sshd applies the FIRST value it sees
# for every keyword, and the Include sits at the top of the main file, so every
# setting here wins over the Debian defaults further down.

# Host keys live on the /var/lib/proxpass volume, not in the image, so that a
# recreated container keeps its identity and no image-baked (therefore shared
# and public) key is ever used. The entrypoint generates these on first start.
# These paths are duplicated in docker/entrypoint.sh -- keep them in sync.
HostKey /var/lib/proxpass/ssh/ssh_host_rsa_key
HostKey /var/lib/proxpass/ssh/ssh_host_ecdsa_key
HostKey /var/lib/proxpass/ssh/ssh_host_ed25519_key

# Public key authentication only. proxpass users have no password at all: the
# NSS API reports them with a locked shadow entry, and every other auth method
# is turned off explicitly so a misconfiguration cannot fall back to one.
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no
HostbasedAuthentication no
UsePAM no

# root is a real local account in this image and must never be reachable.
PermitRootLogin no

# proxpass users have no home directory on disk, so sshd must not look for
# ~/.ssh/authorized_keys. Keys come from the proxpass API instead.
AuthorizedKeysFile none
AuthorizedKeysCommand /usr/local/bin/proxpass-authorized-keys
# Runs as root: the helper calls `proxpass authorized-keys', which reads the
# on-disk proxpass database/state under /var/lib/proxpass (mode 0700, root
# owned). `nobody' -- the usual recommendation -- cannot read it. The helper is
# a fixed, root-owned, non-writable wrapper that takes exactly one argument and
# only writes authorized_keys lines to stdout, so the extra privilege is not
# reachable by the connecting user.
AuthorizedKeysCommandUser root

# Note on ExposeAuthInfo: it is deliberately NOT set.
#
# It used to be required. The session read $SSH_USER_AUTH to learn which key
# authenticated and resolved the identity from the database itself. Both
# halves of that are gone: the session has no database access, and the file
# is written into the session's own /tmp owned and WRITABLE BY THE SESSION
# USER -- so a session could rewrite it to claim any key. It was a forgeable
# answer to "who is calling".
#
# The answer now comes from the token on the authorized_keys line below,
# minted by root before the session exists and selected by sshd's own key
# matching, which the session cannot influence.

# Let a client turn the guest console status bar off with
#   ssh -o SetEnv=PROXPASS_DISABLE_STATUSBAR=1 ...
#
# sshd builds a fresh environment for every session: it does not inherit the
# container's, and it drops any variable the client sends that is not listed
# here. Without this line the escape hatch is unreachable in the shipped
# image -- `proxpass session' reads the variable with os.Getenv and would
# never see it (see console.DisableStatusBarEnv).
#
# It must stay an exact name and NEVER become `PROXPASS_*'. The session binary
# takes --admin-key and --data from PROXPASS_ADMIN_KEY and PROXPASS_DATA, so a
# pattern would let a client point its own session at a database it chose, or
# supply the admin key list it is about to be checked against. Only variables
# that are purely cosmetic belong here.
AcceptEnv PROXPASS_DISABLE_STATUSBAR

# Let AuthorizedKeysCommand hand the session its API token.
#
# `proxpass authorized-keys' puts an environment="PROXPASS_SESSION_TOKEN=..."
# option on each key line it prints, and sshd applies the options of the KEY
# THAT AUTHENTICATED only -- so the session receives the token minted for
# whoever actually logged in, and no other. Without this setting sshd parses
# the option and silently discards it.
#
# The argument is a list of permitted NAMES, not a blanket yes. That matters:
# a bare `PermitUserEnvironment yes' would also honour LD_PRELOAD and friends
# from an authorized_keys line. Only proxpass writes these lines today, but
# the narrow form means a bug in that writer cannot turn into arbitrary code
# execution in the session.
#
# This is the OPPOSITE direction to AcceptEnv above: AcceptEnv lets the
# CLIENT send a variable in, which is why PROXPASS_SESSION_TOKEN must never
# be listed there -- the client would then supply its own token rather than
# receive one. Here the SERVER sets it, from a line only root can produce.
PermitUserEnvironment PROXPASS_SESSION_TOKEN

# Every session is a proxpass session, whatever the client asks for. The real
# request ends up in $SSH_ORIGINAL_COMMAND, which `proxpass session' reads.
ForceCommand /usr/local/bin/proxpass-session

# proxpass is an interactive guest picker / console proxy: it needs a PTY, and
# it needs nothing else.
PermitTTY yes

# Blocks TCP, stream-local (unix socket), X11 and agent forwarding in one
# directive. The individual options below are redundant with it but kept as
# explicit documentation, and as a fallback on an sshd older than 8.2 that
# does not know DisableForwarding. Without stream-local forwarding disabled,
# a session could reach the loopback directory API over a forwarded socket:
# AllowTcpForwarding alone does NOT cover it.
DisableForwarding yes
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitOpen none

# proxpass users have no real home directory and must not be able to run
# anything at login. ForceCommand already governs the session, but ~/.ssh/rc
# would run before it.
PermitUserRC no

# sftp and scp are SERVED, by proxpass itself.
#
# The main sshd_config declares the sftp subsystem and a drop-in cannot
# redefine it ("Subsystem 'sftp' already defined"), so it is left alone. That
# does not matter: ForceCommand replaces any subsystem request and puts the
# subsystem's path in SSH_ORIGINAL_COMMAND, so the request reaches `proxpass
# session', which recognizes it and speaks the SFTP protocol against the guest
# named by the login name:
#
#     scp file.txt ct100@host:/tmp/
#     sftp ct100@host
#
# /usr/lib/openssh/sftp-server is therefore never executed -- proxpass answers
# instead, and the binary's presence in the image is irrelevant.
#
# Note that this covers plain scp as well: since OpenSSH 9.0 scp speaks SFTP
# by default and does NOT fall back to the old scp protocol, so serving SFTP
# is what makes an unflagged scp work.
#
# One consequence worth knowing when debugging: sshd discards a subsystem
# session's stderr, so a failure before the protocol starts is invisible to
# the client ("Connection closed" and nothing more). Such failures are logged
# by the session instead; see internal/session/sftp.go.

# Reap sessions whose client has vanished. A wedged guest console would
# otherwise hold the session, and its database handle, indefinitely.
ClientAliveInterval 30
ClientAliveCountMax 4

# The image has no /var/empty chroot-able sshd privsep dir story beyond the
# default, and no /run/sshd at build time; the entrypoint creates it.
PidFile /run/sshd.pid

PrintMotd no
