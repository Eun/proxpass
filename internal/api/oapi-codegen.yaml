# oapi-codegen configuration.
#
# Types, the server interface, and the HTTP client are generated: the handlers
# stay hand-written. The point of generating is that the spec and the Go types
# cannot drift -- not to hand request routing to a framework proxpass does not
# otherwise use. The client is generated so the admin CLI (and external
# callers) speak the same typed API the server implements.
#
# std-http-server matches what the server already is (net/http + ServeMux),
# so nothing new is pulled into the dependency tree.
package: api
output: openapi_gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  client: true
  embedded-spec: true
output-options:
  # The NSS wire format fixes these names; a generated "Uid" must stay "Uid".
  # oapi-codegen would otherwise produce idiomatic Go names and silently
  # change the JSON a running nss_http depends on.
  name-normalizer: ToCamelCaseWithInitialisms
