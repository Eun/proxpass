# oapi-codegen configuration.
#
# oapi-codegen generates the models, the strict server interface, the chi
# router that dispatches to it, and the HTTP client. Only the handler bodies
# are hand-written. Generating the router (not just the types) is the point:
# the routing table, parameter binding, and request/response plumbing come
# from the spec, so they cannot drift from it -- the same approach ziam uses.
#
# chi-server is the generated server: HandlerFromMux mounts the strict handler
# onto a chi.Router, onto which the hand-written NSS directory and /admin/rpc
# routes are also registered (see server.go). The client is generated so the
# admin CLI (and external callers) speak the same typed API the server
# implements.
package: api
output: openapi_gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  client: true
  embedded-spec: true
output-options:
  # The NSS wire format fixes these names; a generated "Uid" must stay "Uid".
  # oapi-codegen would otherwise produce idiomatic Go names and silently
  # change the JSON a running nss_http depends on.
  name-normalizer: ToCamelCaseWithInitialisms
