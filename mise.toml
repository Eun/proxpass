[tools]
go = "1.26.8"
golangci-lint = "2.12.2"
goreleaser = "2.16.0"

# The guest helper is embedded into the proxpass binary, one build per
# architecture a Proxmox node can be, because it has to run on the NODE's cpu
# rather than this one. internal/guesthelper/bin holds committed placeholders
# so a fresh checkout compiles; this task replaces them with real binaries.
#
# Must run BEFORE any build that will be shipped. `go build' alone produces a
# binary whose embedded helpers are placeholders, which is caught at run time
# by an ELF magic check rather than silently pushed to a node.
[tasks.helpers]
description = "Build the guest helper for every supported node architecture"
# Built to a temporary path and then MOVED into place. Two reasons, both
# learned the hard way: `go build -o' refuses to overwrite a file that is
# not already an object file, and the committed placeholders are text; and
# deleting them first breaks the //go:embed in the very package being
# compiled, so the build that is meant to replace them cannot run.
run = [
  "GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags='-s -w' -o $MISE_PROJECT_ROOT/dist/proxpass-helper-amd64 ./cmd/proxpass-helper",
  "GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags='-s -w' -o $MISE_PROJECT_ROOT/dist/proxpass-helper-arm64 ./cmd/proxpass-helper",
  "mv -f $MISE_PROJECT_ROOT/dist/proxpass-helper-amd64 internal/guesthelper/bin/proxpass-helper-amd64",
  "mv -f $MISE_PROJECT_ROOT/dist/proxpass-helper-arm64 internal/guesthelper/bin/proxpass-helper-arm64",
]

[tasks.build]
description = "Build the proxpass binary"
depends = ["helpers"]
run = "go build -o proxpass ./cmd/proxpass"

[tasks.generate]
description = "Regenerate the OpenAPI types from api/openapi.yaml"
run = "go generate ./internal/api/..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run tests with coverage"
run = "go test -v -count=1 -cover -coverprofile=coverage.out -covermode=atomic ./..."

[tasks.release]
description = "Run GoReleaser (snapshot)"
run = "goreleaser release --snapshot --clean"

# the image is the only release artifact, so build it the same way goreleaser
# does: the binary first, then `docker build' with the repo root as context
# (the Dockerfile COPYs from docker/, and goreleaser stages that directory into
# dist/ via extra_files so both paths line up).
[tasks.docker]
description = "Build the proxpass docker image locally"
depends = ["helpers"]
run = [
  "go build -ldflags='-s -w' -o dist/proxpass ./cmd/proxpass",
  "docker build -f .github/Dockerfile --build-arg BINARY=dist/proxpass -t proxpass:local .",
]

# smoke test of the image itself: does the NSS module ship, is nsswitch.conf
# wired to it, and does sshd accept the generated config?
[tasks.docker-check]
description = "Verify the layout and sshd config of the local proxpass image"
depends = ["docker"]
run = """
docker run --rm --entrypoint /bin/sh proxpass:local -euc '
  echo "--- nss module ---"
  ls -l /lib/libnss_http.so.2
  ls -l /sbin/nss_http /sbin/nss_http_sshkey
  echo "--- nsswitch.conf ---"
  grep -E "^(passwd|group|shadow|gshadow):" /etc/nsswitch.conf
  echo "--- authorized keys command permissions ---"
  ls -l /usr/local/bin/proxpass-authorized-keys
  echo "--- sshd -t ---"
  mkdir -p /var/lib/proxpass/ssh
  for t in rsa ecdsa ed25519; do
    ssh-keygen -q -t "$t" -f "/var/lib/proxpass/ssh/ssh_host_${t}_key" -N ""
  done
  /usr/sbin/sshd -t
  echo "sshd config ok"
'
"""

# needs the PROXPASS_* proxmox settings in the environment, e.g.
#   PROXPASS_PROXMOX_URL=... mise run docker-run
# then: ssh -p 2222 <user>@localhost
[tasks.docker-run]
description = "Run the proxpass image locally, ssh on localhost:2222"
depends = ["docker"]
run = "docker run --rm -it -p 2222:22 -v proxpass-data:/var/lib/proxpass proxpass:local"

[tasks.mock]
description = "Run the mock Proxmox service"
run = "go run ./cmd/proxmox-mock"

[tasks.clean]
description = "Remove build artifacts"
run = [
  "rm -rf proxpass proxmox-mock dist coverage.out",
  "docker rmi -f proxpass:local 2>/dev/null || true",
]
